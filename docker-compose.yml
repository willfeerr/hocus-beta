services:
  hocuspocus:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_started
      createbucket:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: ${PORT:-1234}
      HOCUSPOCUS_NAME: ${HOCUSPOCUS_NAME:-skrbe-hocuspocus}

      # Initial deploy mode. For the real app, switch AUTH_MODE to webhook and set AUTH_ENDPOINT.
      AUTH_MODE: ${AUTH_MODE:-static}
      HOCUSPOCUS_TOKEN: ${SERVICE_PASSWORD_HOCUSPOCUS}
      AUTH_ENDPOINT: ${AUTH_ENDPOINT:-}
      AUTH_WEBHOOK_TIMEOUT_MS: ${AUTH_WEBHOOK_TIMEOUT_MS:-5000}

      # Keep SKRBE/Notion rooms explicit but still flexible.
      ROOM_NAME_REGEX: ${ROOM_NAME_REGEX:-^[a-zA-Z0-9:._-]{1,240}$}

      # Source of truth for Yjs binaries.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-hocuspocus-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PREFIX: ${S3_PREFIX:-hocuspocus-documents/}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      AWS_ACCESS_KEY_ID: ${SERVICE_USER_MINIO}
      AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_MINIO}

      # Realtime fanout for multiple replicas.
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOCUSPOCUS_TIMEOUT_MS: ${HOCUSPOCUS_TIMEOUT_MS:-60000}
      HOCUSPOCUS_DEBOUNCE_MS: ${HOCUSPOCUS_DEBOUNCE_MS:-2000}
      HOCUSPOCUS_MAX_DEBOUNCE_MS: ${HOCUSPOCUS_MAX_DEBOUNCE_MS:-10000}
      HOCUSPOCUS_MAX_PAYLOAD_BYTES: ${HOCUSPOCUS_MAX_PAYLOAD_BYTES:-10485760}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-1234}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    expose:
      - "1234"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
    volumes:
      - minio-data:/data

  createbucket:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    exclude_from_hc: true
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/$$S3_BUCKET;
      /usr/bin/mc anonymous set none local/$$S3_BUCKET;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
      S3_BUCKET: ${S3_BUCKET:-hocuspocus-documents}

volumes:
  redis-data:
  minio-data:
